[package]
name = "swarm-core"
version = "2.0.0"
edition = "2024"
authors = ["anthra123x"]
license = "MIT"
description = "High-performance native Rust core engine for OpenCode Swarm v2"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled", "bundled-full", "functions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
ureq = { version = "2.9", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"

